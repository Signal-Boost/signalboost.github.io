<!DOCTYPE html> <!-- Must be the very first line -->

<!-- =====================================================================
     404.html — "Page not found" page.
     GitHub Pages automatically shows this file whenever someone visits
     an address on your site that doesn't exist (e.g. a typo'd link).
     The styles are written INSIDE this file (in <style> below) instead of
     using css/styles.css, so it still looks right no matter which broken
     address the visitor typed.
     ===================================================================== -->

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found | Signal Boost</title>
  <meta name="robots" content="noindex"> <!-- Tells Google not to list this page in search results -->

  <!-- <style> lets you write CSS directly inside an HTML file -->
  <style>
    body {
      margin: 0;
      min-height: 100vh;               /* 100vh = full height of the screen */
      display: flex;                   /* Flexbox to center content...      */
      align-items: center;             /* ...vertically                     */
      justify-content: center;         /* ...and horizontally               */
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f7fa;
      color: #2b2f36;
      padding: 20px;
    }
    h1 { font-size: 5rem; margin: 0; color: #0f2340; }  /* Big "404" */
    p  { font-size: 1.15rem; color: #5f6b7a; }
    a {
      display: inline-block;
      margin-top: 12px;
      padding: 14px 28px;
      background: #f2994a;
      color: #fff;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div>
    <h1>404</h1>
    <p>Sorry, that page doesn't exist.</p>
    <!-- href="/" = the root of the site. If your site lives at
         username.github.io/repo-name/, change this to href="/repo-name/" -->
    <a href="/">Back to home</a>
  </div>
</body>
</html>
